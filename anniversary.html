<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Soupy 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#F5A6C8;--orange:#F4A261;--peach:#FFD6B0;--white:#FFF9F5;--rose:#D85B87;
--ink:#8a3556;--bg1:#FFD6B0;--bg2:#F5A6C8;--sky1:#F9D3E6;--sky2:#FFE8D0;
--hand:'Caveat','Segoe Script','Bradley Hand',cursive;--round:'Nunito','Trebuchet MS',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#FFD6E6;--bg1:#5a3045;--bg2:#2d1a2c;--sky1:#3a2442;--sky2:#6b3c4f}}
:root[data-theme="dark"]{--ink:#FFD6E6;--bg1:#5a3045;--bg2:#2d1a2c;--sky1:#3a2442;--sky2:#6b3c4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--round);overflow:hidden}
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);opacity:0;pointer-events:none;transition:opacity .8s ease;text-align:center}
.screen.on{opacity:1;pointer-events:auto}
#s2{background:linear-gradient(var(--sky1),var(--sky2))}
.hand{font-family:var(--hand);font-weight:700;line-height:1.1}
h1.hand{font-size:clamp(26px,6vw,38px);margin:0}
#amb,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#amb{z-index:5}#fx{z-index:60}
.amb{position:absolute;bottom:-40px;opacity:.7;animation:rise linear forwards}
.spark{position:absolute;color:#fff;animation:tw 1.6s ease-in-out forwards;text-shadow:0 0 6px var(--orange)}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px) rotate(25deg);opacity:0}}
@keyframes tw{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.2) rotate(90deg);opacity:1}100%{transform:scale(0) rotate(180deg);opacity:0}}
.b{position:fixed;animation:burst 1.3s ease-out forwards;pointer-events:none}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}

/* envelope */
.env{--w:min(300px,76vw);position:relative;width:var(--w);height:calc(var(--w)*.65);perspective:900px;font-size:var(--w);cursor:pointer}
.env>*{position:absolute}
.back{inset:0;background:#E883AD;border-radius:10px;box-shadow:0 10px 24px rgba(216,91,135,.35)}
.pocket{inset:0;z-index:2;background:#F7B3CF;border-radius:10px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{left:0;top:0;width:100%;height:60%;z-index:3;background:#EE95BC;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .35s}
.seal{left:50%;top:58%;z-index:5;width:.15em;height:.15em;transform:translate(-50%,-50%);border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:.085em;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .4s,opacity .4s;animation:beat 1.6s ease-in-out infinite}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(0);animation:none}
.letter{z-index:1;left:5%;right:5%;bottom:4%;height:125%;background:var(--white);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);transform-origin:bottom;transform:scaleY(.5);transition:transform 1s cubic-bezier(.2,.9,.3,1) .45s;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--rose);font-family:var(--hand);font-weight:700;padding:0 4%;box-sizing:border-box;text-align:center;
background-image:radial-gradient(circle at 12% 10%,#FFD6B0 0 6%,transparent 7%),radial-gradient(circle at 90% 92%,#F5A6C8 0 6%,transparent 7%)}
.open .letter{transform:translateY(-70%) scaleY(1)}
.letter p{margin:0;font-size:.088em;line-height:1.15;opacity:0;transition:opacity .8s 1.2s}
.letter .big{font-size:.17em;margin:.1em 0;color:var(--rose);letter-spacing:.02em;transition-delay:1.6s;animation:beat 1.4s ease-in-out infinite}
.letter svg{opacity:0;transition:opacity .8s 2s;animation:beat 1.1s ease-in-out infinite}
.open .letter p,.open .letter svg{opacity:1}
@keyframes beat{50%{transform:scale(1.12)}}
.seal{--x:0}
.float{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(-1.5deg)}}

/* form */
input{font:800 17px var(--round);width:min(300px,76vw);padding:13px 18px;border-radius:999px;border:3px solid var(--pink);background:var(--white);color:#7a2f4d;text-align:center;outline:none;box-shadow:0 6px 16px rgba(216,91,135,.18)}
input:focus{border-color:var(--rose)}
input::placeholder{color:#c78aa3}
button.cta{font:800 17px var(--round);color:#fff;border:0;border-radius:999px;padding:13px 28px;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--orange));box-shadow:0 8px 18px rgba(216,91,135,.35);transition:transform .2s}
button.cta:hover{transform:scale(1.07) rotate(-1deg)}button.cta:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
#nope{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,249,245,.88);cursor:pointer;animation:shake .5s}
#nope.on{display:flex}
#nope .x{font-size:min(46vmin,300px);line-height:1}
#nope .t{font:800 clamp(28px,8vw,56px) var(--round);color:#e02424;letter-spacing:.04em}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-18px) rotate(-2deg)}35%{transform:translateX(16px) rotate(2deg)}55%{transform:translateX(-12px)}75%{transform:translateX(10px)}}

/* scene */
#scene{width:min(94vw,620px);height:auto;max-height:68vh;overflow:visible}
.cloud{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(22px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}
@keyframes sw{to{transform:rotate(6deg)}}
.smoke{animation:sm 3s ease-out infinite;opacity:0}
@keyframes sm{from{transform:translate(0,0) scale(.5);opacity:.8}to{transform:translate(10px,-34px) scale(1.4);opacity:0}}
.fig{transform-box:fill-box;transform-origin:50% 100%}
#momo .fig{animation:bob 1.6s ease-in-out infinite}
#soupy .fig{animation:bob 1.6s ease-in-out .35s infinite;transition:scale .2s}
@keyframes bob{50%{transform:translateY(-4px)}}
#soupy{cursor:pointer}
#soupy:hover .fig,#soupy:focus-visible .fig{scale:1.18}
#soupy .hh{opacity:0;transition:opacity .2s}
#soupy:hover .hh,#soupy:focus-visible .hh{opacity:1;animation:up 1s ease-out infinite}
@keyframes up{from{transform:translateY(6px)}to{transform:translateY(-12px);opacity:0}}
#soupy:focus{outline:none}
.hhp{animation:beat 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bf{animation:fly 9s ease-in-out infinite alternate}
.bf.two{animation-duration:12s;animation-delay:-4s}
@keyframes fly{0%{transform:translate(20px,120px)}50%{transform:translate(180px,60px)}100%{transform:translate(340px,130px)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
.hint{font-size:15px;font-weight:800;opacity:.85;animation:beat 2s ease-in-out infinite}

/* surprise */
#dim{position:fixed;inset:0;z-index:10;background:rgba(80,20,50,.45);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#pop{position:fixed;z-index:11;left:0;top:0;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.15);transition:left 1.1s cubic-bezier(.3,1.3,.5,1),top 1.1s cubic-bezier(.3,1.3,.5,1),transform 1.1s cubic-bezier(.3,1.3,.5,1),opacity .4s}
#pop.go{opacity:1;left:50%;top:50%;transform:translate(-50%,-50%) scale(1)}
#pop.ready{pointer-events:auto}
#ew{transition:transform 1s ease .3s}
#ew.open{transform:translateY(80px)}
#ew .env:hover{transform:scale(1.04)}
#ew .env{transition:transform .2s}
#ew.open .env{cursor:default}
.cap{position:absolute;left:0;right:0;top:calc(100% + 10px);font:700 24px var(--hand);color:#fff;text-align:center;transition:opacity .3s}
.open+.cap,#ew.open .cap{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}#amb{display:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<path id="hp" d="M0 3C-9-4-7-10-3.5-10-1.5-10 0-8 0-7 0-8 1.5-10 3.5-10 7-10 9-4 0 3Z"/>
<g id="fl"><line x1="0" y1="0" x2="0" y2="24" stroke="#8CC08A" stroke-width="2"/>
<g fill="currentColor"><circle cx="0" cy="-5" r="4.2"/><circle cx="5" cy="-1.5" r="4.2"/><circle cx="3" cy="4" r="4.2"/><circle cx="-3" cy="4" r="4.2"/><circle cx="-5" cy="-1.5" r="4.2"/></g>
<circle r="3" fill="#F4A261"/></g>
</defs></svg>

<div id="amb"></div><div id="fx"></div>

<!-- 1: secret envelope -->
<section class="screen on" id="s1">
  <h1 class="hand">hello genius</h1>
  <div id="e1" class="float"></div>
  <div class="hand" style="font-size:28px">who dis</div>
  <input id="name" type="text" placeholder="Enter your name" autocomplete="off" autocapitalize="off" aria-label="Secret name">
  <button class="cta" id="go">Open my letter </button>
</section>

<div id="nope" role="alert"><div class="x">❌</div><div class="t">NOT ALLOWED</div></div>

<!-- 2: little home -->
<section class="screen" id="s2">
  <h1 class="hand">soupy and momo hous</h1>
  <svg id="scene" viewBox="0 0 400 340" role="img" aria-label="A cozy cottage with momo and soupy inside">
    <g class="cloud" fill="#fff" opacity=".9"><ellipse cx="60" cy="50" rx="28" ry="12"/><ellipse cx="80" cy="42" rx="20" ry="12"/><ellipse cx="320" cy="70" rx="30" ry="12"/><ellipse cx="338" cy="60" rx="18" ry="11"/></g>
    <ellipse cx="200" cy="335" rx="270" ry="45" fill="#C9E8BC"/>
    <ellipse cx="305" cy="318" rx="12" ry="4" fill="#FFD6B0"/><ellipse cx="292" cy="330" rx="12" ry="4" fill="#FFD6B0"/>
    <!-- house -->
    <rect x="262" y="70" width="24" height="55" fill="#F4A261" stroke="#D85B87" stroke-width="2.5"/>
    <circle class="smoke" cx="274" cy="64" r="6" fill="#fff"/><circle class="smoke" style="animation-delay:1.5s" cx="274" cy="64" r="5" fill="#fff"/>
    <rect x="60" y="148" width="280" height="152" rx="8" fill="#FFF9F5" stroke="#D85B87" stroke-width="2.5"/>
    <polygon points="45,152 200,52 355,152" fill="#F5A6C8" stroke="#D85B87" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="200" cy="112" r="14" fill="#FFD6B0" stroke="#F4A261" stroke-width="4"/><path d="M200 98v28M186 112h28" stroke="#F4A261" stroke-width="2"/>
    <!-- room -->
    <rect x="100" y="170" width="172" height="105" rx="10" fill="#FFD6B0" stroke="#F4A261" stroke-width="5"/>
    <rect x="112" y="180" width="30" height="30" rx="4" fill="#FFF9F5" stroke="#F4A261" stroke-width="3"/><path d="M127 180v30M112 195h30" stroke="#F4A261" stroke-width="1.5"/>
    <rect x="230" y="180" width="30" height="30" rx="4" fill="#FFF9F5" stroke="#F4A261" stroke-width="3"/><path d="M245 180v30M230 195h30" stroke="#F4A261" stroke-width="1.5"/>
    <path d="M104 270h164" stroke="#F4A261" stroke-width="3" opacity=".6"/>
    <!-- door -->
    <rect x="282" y="222" width="42" height="78" rx="18" ry="18" fill="#F4A261" stroke="#D85B87" stroke-width="2.5"/><circle cx="314" cy="264" r="3" fill="#FFF9F5"/>
    <rect x="70" y="205" width="22" height="26" rx="3" fill="#FFD6B0" stroke="#F4A261" stroke-width="3"/>
    <!-- hearts -->
    <use href="#hp" x="185" y="188" fill="#D85B87" class="hhp"/>
    <use href="#hp" x="170" y="178" fill="#F5A6C8" transform="translate(0 0) scale(.6)" style="transform-origin:170px 178px"/>
    <!-- momo -->
    <g id="momo" transform="translate(160 0)"><g class="fig">
      <circle cx="0" cy="191" r="5.5" fill="#D85B87"/>
      <g stroke="#D85B87" stroke-width="2.4" stroke-linecap="round" fill="none"><circle cx="0" cy="205" r="11" fill="#FFF9F5"/><path d="M0 216V245M0 224L-14 236M0 224L25 238M0 245L-9 270M0 245L9 270"/></g>
      <circle cx="-4" cy="204" r="1.4" fill="#5a2a3d"/><circle cx="4" cy="204" r="1.4" fill="#5a2a3d"/>
      <path d="M-3.5 208Q0 211.5 3.5 208" stroke="#5a2a3d" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <circle cx="-7" cy="208" r="2" fill="#F5A6C8" opacity=".8"/><circle cx="7" cy="208" r="2" fill="#F5A6C8" opacity=".8"/>
      <use href="#hp" x="0" y="180" fill="#F5A6C8" transform="translate(0 -4)"/>
    </g></g>
    <text x="160" y="291" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="16" fill="#D85B87">momo</text>
    <!-- soupy -->
    <g id="soupy" transform="translate(210 0)" tabindex="0" role="button" aria-label="Click soupy"><g class="fig">
      <rect x="-24" y="190" width="48" height="86" fill="transparent"/>
      <circle cx="-12" cy="201" r="4.5" fill="#F4A261"/><circle cx="12" cy="201" r="4.5" fill="#F4A261"/>
      <g stroke="#D85B87" stroke-width="2.4" stroke-linecap="round" fill="none"><circle cx="0" cy="205" r="11" fill="#FFF9F5"/><path d="M0 216V245M0 224L-25 238M0 224L14 236M0 245L-9 270M0 245L9 270"/><path d="M-10 202Q0 190 10 202" stroke="#F4A261"/></g>
      <circle cx="-4" cy="204.5" r="1.4" fill="#5a2a3d"/><circle cx="4" cy="204.5" r="1.4" fill="#5a2a3d"/>
      <path d="M-4 208Q0 212 4 208" stroke="#5a2a3d" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <circle cx="-7" cy="208" r="2" fill="#F5A6C8" opacity=".8"/><circle cx="7" cy="208" r="2" fill="#F5A6C8" opacity=".8"/>
      <use href="#hp" x="0" y="184" fill="#D85B87" class="hh" transform="scale(.8)" style="transform-origin:0 184px"/>
    </g>
    <text x="0" y="291" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="16" fill="#D85B87">soupy</text></g>
    <!-- garden -->
    <g><g class="sway"><use href="#fl" x="22" y="286" color="#F5A6C8"/></g><g class="sway" style="animation-delay:-1s"><use href="#fl" x="46" y="290" color="#F4A261"/></g><g class="sway" style="animation-delay:-2s"><use href="#fl" x="76" y="288" color="#D85B87"/></g>
    <use href="#fl" x="100" y="291" color="#FFD6B0"/><g class="sway"><use href="#fl" x="128" y="289" color="#F5A6C8"/></g>
    <g class="sway" style="animation-delay:-1.5s"><use href="#fl" x="240" y="290" color="#F4A261"/></g><use href="#fl" x="262" y="292" color="#D85B87"/>
    <g class="sway"><use href="#fl" x="345" y="288" color="#F5A6C8"/></g><use href="#fl" x="368" y="291" color="#FFD6B0"/><g class="sway" style="animation-delay:-2s"><use href="#fl" x="386" y="287" color="#F4A261"/></g></g>
    <g class="bf"><ellipse class="wing" cx="-4" cy="0" rx="5" ry="6" fill="#F5A6C8"/><ellipse class="wing" cx="4" cy="0" rx="5" ry="6" fill="#F4A261"/><rect x="-1" y="-5" width="2" height="10" rx="1" fill="#D85B87"/></g>
    <g class="bf two"><ellipse class="wing" cx="-4" cy="0" rx="5" ry="6" fill="#F4A261"/><ellipse class="wing" cx="4" cy="0" rx="5" ry="6" fill="#D85B87"/><rect x="-1" y="-5" width="2" height="10" rx="1" fill="#8a3556"/></g>
  </svg>
  <div class="hint">tap soupy</div>
</section>

<!-- 3: surprise -->
<div id="dim"></div>
<div id="pop"><div id="ew"></div></div>

<script>
const $=s=>document.querySelector(s),fx=$('#fx'),amb=$('#amb'),R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
const mk=(cls,txt,css)=>{const s=document.createElement('span');s.className=cls;s.textContent=txt;s.style.cssText=css;return s};
const envHTML=(inner='')=>'<div class="env"><div class="back"></div>'+inner+'<div class="pocket"></div><div class="flap"></div><div class="seal">♥</div></div>';
const letter='<div class="letter"><p>Happy 4 months soupy &lt;3</p><p class="big">I LOVE U</p><svg viewBox="-11 -12 22 17" width="40"><use href="#hp" fill="#D85B87"/></svg></div>';

/* ambient hearts + sparkles */
setInterval(()=>{if(document.hidden||amb.children.length>18)return;
 const s=mk('amb',pick(['♥','♥','✿','♡']),`left:${R()*100}%;font-size:${12+R()*18}px;color:${pick(['#F5A6C8','#D85B87','#F4A261','#FFD6B0'])};animation-duration:${8+R()*6}s`);
 amb.append(s);s.addEventListener('animationend',()=>s.remove())},900);
setInterval(()=>{if(document.hidden)return;
 const s=mk('spark','✦',`left:${R()*95}%;top:${R()*90}%;font-size:${12+R()*14}px`);
 amb.append(s);s.addEventListener('animationend',()=>s.remove())},2200);

function burst(x,y,n=18,spread=160){
 for(let i=0;i<n;i++){const a=R()*6.283,d=spread*(.4+R()*.8);
  const s=mk('b',pick(['💗','💖','✨','🌸','🧡','💕']),`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;font-size:${14+R()*16}px`);
  fx.append(s);s.addEventListener('animationend',()=>s.remove())}}

/* screen 1 */
$('#e1').innerHTML=envHTML();
const inp=$('#name'),nope=$('#nope');let busy=false,t;
const hideNope=()=>{nope.classList.remove('on');inp.select();inp.focus()};
function enter(){
 if(busy)return;
 const v=inp.value.trim().toLowerCase();
 if(v==='soupy'||v==='momo'){
  busy=true;$('#e1 .env').classList.add('open');
  const r=$('#e1').getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,34,260);
  setTimeout(()=>burst(innerWidth/2,innerHeight/3,30,320),400);
  setTimeout(()=>{$('#s1').classList.remove('on');$('#s2').classList.add('on')},1500);
 }else{nope.classList.add('on');clearTimeout(t);t=setTimeout(hideNope,1800)}
}
$('#go').addEventListener('click',enter);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
nope.addEventListener('click',()=>{clearTimeout(t);hideNope()});

/* screen 2 -> 3 */
const soupy=$('#soupy'),pop=$('#pop'),ew=$('#ew'),dim=$('#dim');let popped=false,opened=false;
function surprise(){
 if(popped)return;popped=true;
 const r=soupy.getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height/3;
 dim.classList.add('on');
 ew.innerHTML=envHTML(letter)+'<div class="cap">open me 💌</div>';
 pop.style.left=sx+'px';pop.style.top=sy+'px';
 burst(sx,sy,16,110);
 requestAnimationFrame(()=>requestAnimationFrame(()=>pop.classList.add('go')));
 setTimeout(()=>{pop.classList.add('ready');burst(innerWidth/2,innerHeight/2,14,150)},1100);
}
soupy.addEventListener('click',surprise);
soupy.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();surprise()}});
ew.addEventListener('click',()=>{
 if(opened||!pop.classList.contains('ready'))return;opened=true;
 ew.classList.add('open');ew.firstChild.classList.add('open');
 const c=()=>burst(innerWidth/2,innerHeight/2-40,20,230);
 c();setTimeout(c,500);setInterval(()=>{if(!document.hidden)burst(innerWidth/2,innerHeight/2-40,6,200)},1800);
});
</script>
</body>
</html>
